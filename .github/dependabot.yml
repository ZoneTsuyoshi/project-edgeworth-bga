# 依存の週次更新（仕様書 005 §6）。composer は第 2 段階で composer.json を追加するときに足す
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dev:
        patterns: ["*"]
