# 依存の週次更新（仕様書 005 §6）
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dev:
        patterns: ["*"]
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-dev:
        patterns: ["*"]
