# スプライトの生成と容量・寸法の検査（仕様書 005 第 3 段階の A1、012 §7.5）。
# lint とは別のワークフローにし、Lint gate には含めない（005 未確定事項 No.6 の暫定案。理由は docs/development/cicd.md）。
# 失敗した PR はマージしないので、マージ前の gh pr checks で "Sprites" も確認する。
name: Assets

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/build-sprites.mjs'
      - 'scripts/check-sprites.mjs'
      - 'scripts/lib/sprite-layout.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/assets.yml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/build-sprites.mjs'
      - 'scripts/check-sprites.mjs'
      - 'scripts/lib/sprite-layout.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/assets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sprites:
    name: Sprites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 生成の最後に同じ検査が走るが、検査を単独の手順にして失敗箇所を見やすくする
      - name: Build sprites
        run: npm run build:sprites

      - name: Check sprites (size, dimensions, names)
        run: npm run check:sprites
